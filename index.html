<!doctype html>
<html lang="id" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <!-- Terapkan tema tersimpan sebelum CSS dimuat (mencegah kilatan putih). Logika lengkap ada di js/tema.js. -->
  <script>
    (function () {
      try {
        var m = localStorage.getItem('sim-mutasi-tema');
        var gelap = m === 'gelap' || (m !== 'terang' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        r.classList.toggle('dark', gelap);
        r.style.colorScheme = gelap ? 'dark' : 'light';
        if (gelap) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1220');
      } catch (e) { /* abaikan */ }
    })();
  </script>
  <title>SIM Mutasi Siswa - SMP Negeri 1 Tapa</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SIM Mutasi">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            acc: {
              DEFAULT: '#2563eb',
              h: '#1d4ed8',
              light: '#eff6ff',
            },
            side: '#0f172a',
            'side-ink': '#94a3b8',
            garis: '#e2e8f0',
            lat: '#f8fafc',
            ink: '#0f172a',
            redup: '#64748b',
            bad: '#ef4444',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/komponen.css">
  <link rel="stylesheet" href="css/desain.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/tema.css">
  <script src="config.js"></script>
</head>
<body class="h-full font-sans antialiased bg-slate-50 text-slate-900 selection:bg-blue-500 selection:text-white">
  <!-- Indikator progres perpindahan halaman (diatur oleh js/app.js lewat body[data-memuat]) -->
  <div id="bar-muat" aria-hidden="true"></div>

  <!-- Layar pemuatan awal & Login -->
  <div id="layar" class="min-h-dvh grid place-items-center p-4 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="w-full max-w-sm text-center" role="status">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent mb-4"></div>
      <p class="text-slate-300 font-medium">Memuat aplikasi SIM Mutasi...</p>
    </div>
  </div>

  <!-- Kerangka Aplikasi (setelah login) -->
  <div id="aplikasi" class="hidden min-h-dvh flex flex-col">
    <div class="min-h-dvh sm:flex flex-1">
      <a href="#isi" id="lompat" class="sr-only focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-50 focus:rounded-lg focus:bg-blue-600 focus:text-white focus:px-4 focus:py-2.5 focus:shadow-lg focus:outline-none">Lewati ke konten utama</a>
      
      <div id="scrim" class="fixed inset-0 z-30 hidden bg-slate-900/60 backdrop-blur-sm sm:hidden transition-opacity" aria-hidden="true"></div>

      <aside id="samping" aria-label="Menu utama" data-buka="false"
        class="fixed inset-y-0 left-0 z-40 flex w-72 -translate-x-full flex-col bg-slate-900 text-slate-400 transition-transform duration-300 ease-in-out data-[buka=true]:translate-x-0 sm:sticky sm:top-0 sm:h-dvh sm:shrink-0 sm:translate-x-0 shadow-2xl sm:shadow-none border-r border-slate-800">
        
        <div class="flex items-center justify-between gap-3 px-5 py-5 border-b border-slate-800/80">
          <div class="flex items-center gap-3.5">
            <div class="h-10 w-10 rounded-xl bg-blue-600/20 border border-blue-500/30 grid place-items-center shrink-0 shadow-inner">
              <img src="assets/logo-sekolah.png" alt="" width="32" height="32" class="h-8 w-8 object-contain" onerror="this.src='assets/favicon.svg'">
            </div>
            <div class="leading-tight text-white">
              <strong id="sekolah-1" class="block font-bold text-base tracking-tight">SMP Negeri 1</strong>
              <span id="sekolah-2" class="block text-xs font-medium text-slate-400">Tapa</span>
            </div>
          </div>
          <button type="button" id="tutup-laci" aria-label="Tutup menu" class="rounded-lg p-2 text-slate-400 hover:bg-slate-800 hover:text-white transition-colors sm:hidden">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>

        <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1 scrollbar-thin">
          <ul id="menu" class="space-y-1"></ul>
        </nav>

        <div class="flex items-center gap-3 border-t border-slate-800 px-4 py-4 bg-slate-950/40">
          <span id="samping-avatar" class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-gradient-to-tr from-blue-600 to-indigo-500 text-sm font-bold text-white shadow-md" aria-hidden="true"></span>
          <div class="min-w-0 flex-1 leading-tight">
            <b id="samping-nama" class="block truncate text-sm font-semibold text-white"></b>
            <small id="samping-peran" class="block truncate text-xs text-slate-400"></small>
          </div>
        </div>
      </aside>

      <div class="flex min-w-0 flex-1 flex-col">
        <header class="sticky top-0 z-20 flex items-center gap-2 sm:gap-4 border-b border-slate-200/80 bg-white/90 backdrop-blur-md px-4 sm:px-8 py-3.5 shadow-sm">
          <button type="button" id="buka-laci" aria-label="Buka menu" aria-expanded="false" aria-controls="samping" class="rounded-xl p-2 text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors sm:hidden">
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          
          <div id="judul" class="flex-1 truncate text-xl font-bold text-slate-900 tracking-tight"></div>
          
          <!-- Notifikasi (khusus Kepala Sekolah) -->
          <div id="notif" hidden class="shrink-0 sm:relative">
            <button type="button" id="notif-tombol" aria-label="Notifikasi" aria-haspopup="true" aria-expanded="false" aria-controls="notif-panel" class="notif-tombol relative grid h-10 w-10 place-items-center rounded-xl text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-800">
              <svg class="notif-bel h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
              <span id="notif-angka" hidden class="notif-angka absolute -right-0.5 -top-0.5 grid min-h-[1.25rem] min-w-[1.25rem] place-items-center rounded-full bg-rose-600 px-1 text-[0.6875rem] font-bold leading-none text-white ring-2 ring-white"></span>
            </button>
            <div id="notif-panel" hidden class="absolute inset-x-3 top-full z-30 mt-2 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl ring-1 ring-black/5 sm:inset-x-auto sm:right-0 sm:w-96"></div>
          </div>

          <!-- Tema tampilan: tiga pilihan berjejer, langsung dipilih (diatur js/tema.js) -->
          <div id="tema" role="radiogroup" aria-label="Tema tampilan" class="tema-grup shrink-0">
            <span class="tema-geser" aria-hidden="true"></span>
            <button type="button" role="radio" aria-checked="false" data-tema="terang" aria-label="Tema terang" title="Tema terang" class="tema-opsi"><span data-ikon aria-hidden="true" class="grid place-items-center"></span></button>
            <button type="button" role="radio" aria-checked="false" data-tema="gelap" aria-label="Tema gelap" title="Tema gelap" class="tema-opsi"><span data-ikon aria-hidden="true" class="grid place-items-center"></span></button>
            <button type="button" role="radio" aria-checked="false" data-tema="sistem" aria-label="Tema sistem (ikuti perangkat)" title="Tema sistem (ikuti perangkat)" class="tema-opsi"><span data-ikon aria-hidden="true" class="grid place-items-center"></span></button>
          </div>

          <div id="akun" class="relative">
            <button type="button" id="akun-tombol" aria-haspopup="true" aria-expanded="false" aria-controls="akun-panel" class="flex items-center gap-3 rounded-xl p-1.5 hover:bg-slate-100 transition-all border border-transparent hover:border-slate-200">
              <span id="akun-avatar" class="grid h-8 w-8 sm:h-9 sm:w-9 place-items-center rounded-full bg-blue-600 text-xs font-bold text-white shadow-sm" aria-hidden="true"></span>
              <span class="hidden text-left leading-tight sm:block" aria-hidden="true">
                <b id="akun-nama" class="block text-sm font-semibold text-slate-800"></b>
                <small id="akun-peran" class="text-xs text-slate-500 font-medium"></small>
              </span>
              <svg class="block h-4 w-4 text-slate-400" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
            
            <div id="akun-panel" hidden class="absolute right-0 top-full z-30 mt-2 w-64 rounded-2xl border border-slate-200 bg-white p-2 shadow-xl ring-1 ring-black/5">
              <div class="border-b border-slate-100 px-4 py-3 leading-tight bg-slate-50/50 rounded-xl mb-1">
                <strong id="panel-nama" class="block text-sm font-bold text-slate-900"></strong>
                <span id="panel-peran" class="text-xs font-medium text-slate-500"></span>
              </div>
              <button type="button" id="btn-profil" class="flex w-full items-center gap-2.5 rounded-xl px-4 py-2.5 text-left text-sm font-semibold text-slate-700 hover:bg-slate-100 transition-colors">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v1M12 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/></svg>
                Profil Saya
              </button>
              <button type="button" id="btn-keluar" class="flex w-full items-center gap-2.5 rounded-xl px-4 py-2.5 text-left text-sm font-semibold text-rose-600 hover:bg-rose-50 transition-colors">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                Keluar
              </button>
            </div>
          </div>
        </header>

        <main id="isi" tabindex="-1" class="min-w-0 flex-1 p-4 sm:p-8 max-w-7xl w-full mx-auto"></main>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
